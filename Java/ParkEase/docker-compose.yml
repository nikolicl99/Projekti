services:
  mysql:
    image: mysql:8.0
    container_name: parkeasy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: parkeasy123
      MYSQL_DATABASE: parkeasy
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: parkeasy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: parkeasy-pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: parkeasy123
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
  redis_data: